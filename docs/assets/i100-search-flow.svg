<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220" width="1200" height="1220" role="img" aria-labelledby="title desc"><title id="title">SpireExact i100 搜索流程</title><desc id="desc">每一轮派发核心工作、受限的辅助工作、关口重试与聚焦提案；worker 完整执行后协调器吸收结果。首领关口的失败交给关口诊所：根不对时回上一幕换选项，深度不够时在关口附近加深并优先重试。获胜候选独立重放后生成证书。</desc><style>
    text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
    .title{font-size:30px;font-weight:700;fill:#0f172a}
    .sub{font-size:15px;fill:#64748b}
    .tab{font-size:13px;font-weight:700;fill:#ffffff;letter-spacing:.5px}
    .card-title{font-size:17px;font-weight:700}
    .card-line{font-size:14px;fill:#334155}
    .pill{font-size:12.5px;font-weight:600}
    .legend{font-size:13px;fill:#475569}
    .step{font-size:13px;font-weight:700;fill:#ffffff}
    </style><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09" /></filter><linearGradient id="backdrop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc" /><stop offset="1" stop-color="#eef2f7" /></linearGradient><marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.8 L 9 5 L 0 9.2 z" fill="#94a3b8" /></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.8 L 9 5 L 0 9.2 z" fill="#e11d48" /></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.8 L 9 5 L 0 9.2 z" fill="#7c3aed" /></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.8 L 9 5 L 0 9.2 z" fill="#16a34a" /></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.8 L 9 5 L 0 9.2 z" fill="#0d9488" /></marker></defs><rect width="1200" height="1220" rx="24" fill="url(#backdrop)" /><text x="48" y="58" class="title">从一次评估到下一批搜索</text><text x="48" y="86" class="sub">SpireExact · 搜索循环 · 根不对还是深度不够</text><rect x="994.4" y="34" width="157.60000000000002" height="36" rx="18" fill="#1d4ed8" /><text x="1073.2" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">i100 · 0.4.0b1</text><g filter="url(#shadow)"><rect x="300" y="116" width="600" height="108" rx="14" fill="#ffffff" /></g><path d="M300,156 V130 A14,14 0 0 1 314,116 H886 A14,14 0 0 1 900,130 V156 Z" fill="#ccfbf1" /><rect x="300" y="116" width="600" height="108" rx="14" fill="none" stroke="#0d9488" stroke-opacity="0.55" stroke-width="1.3" /><circle cx="326" cy="136.0" r="12" fill="#0d9488" /><text x="326" y="140.5" text-anchor="middle" class="step">1</text><text x="600.0" y="142.0" text-anchor="middle" class="card-title" fill="#134e4a">派发</text><text x="600.0" y="181" text-anchor="middle" class="card-line">核心工作 → 辅助工作（调速器限额）</text><text x="600.0" y="202" text-anchor="middle" class="card-line">→ 关口重试（DEPTH 先，≤ 35%）→ 聚焦 / 探索提案</text><g filter="url(#shadow)"><rect x="300" y="262" width="600" height="108" rx="14" fill="#ffffff" /></g><path d="M300,302 V276 A14,14 0 0 1 314,262 H886 A14,14 0 0 1 900,276 V302 Z" fill="#fef3c7" /><rect x="300" y="262" width="600" height="108" rx="14" fill="none" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.3" /><circle cx="326" cy="282.0" r="12" fill="#d97706" /><text x="326" y="286.5" text-anchor="middle" class="step">2</text><text x="600.0" y="288.0" text-anchor="middle" class="card-title" fill="#78350f">原生执行</text><text x="600.0" y="327" text-anchor="middle" class="card-line">worker 重放前缀或恢复检查点</text><text x="600.0" y="348" text-anchor="middle" class="card-line">地图 · 奖励 · 商店 · 火堆 · 战斗（CombatSolver）</text><g filter="url(#shadow)"><rect x="300" y="408" width="600" height="108" rx="14" fill="#ffffff" /></g><path d="M300,448 V422 A14,14 0 0 1 314,408 H886 A14,14 0 0 1 900,422 V448 Z" fill="#f1f5f9" /><rect x="300" y="408" width="600" height="108" rx="14" fill="none" stroke="#64748b" stroke-opacity="0.55" stroke-width="1.3" /><circle cx="326" cy="428.0" r="12" fill="#64748b" /><text x="326" y="432.5" text-anchor="middle" class="step">3</text><text x="600.0" y="434.0" text-anchor="middle" class="card-title" fill="#0f172a">吸收结果</text><text x="600.0" y="473" text-anchor="middle" class="card-line">档案与检查点 · 关口模型</text><text x="600.0" y="494" text-anchor="middle" class="card-line">诊所登记：stem、关口、入场、重试</text><g filter="url(#shadow)"><polygon points="436.0,556.0 764.0,556.0 790.0,604 764.0,652.0 436.0,652.0 410.0,604" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round" /></g><text x="600" y="594.5" text-anchor="middle" class="card-title" fill="#0f172a">轨迹结局</text><text x="600" y="617.5" text-anchor="middle" class="card-line">获胜 · 首领关口失败 · 其他</text><g filter="url(#shadow)"><rect x="56" y="566" width="236" height="78" rx="14" fill="#ffffff" /></g><path d="M56,602 V580 A14,14 0 0 1 70,566 H278 A14,14 0 0 1 292,580 V602 Z" fill="#dcfce7" /><rect x="56" y="566" width="236" height="78" rx="14" fill="none" stroke="#16a34a" stroke-opacity="0.55" stroke-width="1.3" /><text x="174.0" y="590.0" text-anchor="middle" class="card-title" fill="#14532d">独立新进程重放</text><text x="174.0" y="627" text-anchor="middle" class="card-line">原生终局 → 证书</text><g filter="url(#shadow)"><rect x="908" y="566" width="236" height="78" rx="14" fill="#ffffff" /></g><path d="M908,602 V580 A14,14 0 0 1 922,566 H1130 A14,14 0 0 1 1144,580 V602 Z" fill="#ccfbf1" /><rect x="908" y="566" width="236" height="78" rx="14" fill="none" stroke="#0d9488" stroke-opacity="0.55" stroke-width="1.3" /><text x="1026.0" y="590.0" text-anchor="middle" class="card-title" fill="#134e4a">常规聚焦 / 探索</text><text x="1026.0" y="627" text-anchor="middle" class="card-line">关口前的死亡或预算</text><g filter="url(#shadow)"><polygon points="346.0,732.0 854.0,732.0 880.0,790 854.0,848.0 346.0,848.0 320.0,790" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round" /></g><text x="600" y="770.0" text-anchor="middle" class="card-title" fill="#881337">关口诊所判定</text><text x="600" y="793.0" text-anchor="middle" class="card-line">stem × 首领关口 · ≥ 6 个不同入场</text><text x="600" y="813.0" text-anchor="middle" class="card-line">进度饱和 · 上端点界 · 重试提升 · 满血外推 · 结构缺口</text><g filter="url(#shadow)"><rect x="40" y="924" width="340" height="132" rx="14" fill="#ffffff" /></g><path d="M40,964 V938 A14,14 0 0 1 54,924 H366 A14,14 0 0 1 380,938 V964 Z" fill="#ffe4e6" /><rect x="40" y="924" width="340" height="132" rx="14" fill="none" stroke="#e11d48" stroke-opacity="0.55" stroke-width="1.3" /><text x="210.0" y="950.0" text-anchor="middle" class="card-title" fill="#881337">↺ 根不对</text><text x="210.0" y="989" text-anchor="middle" class="card-line">85% 名额回上一幕换选项</text><text x="210.0" y="1010" text-anchor="middle" class="card-line">新 stem 优先 · 修复方向档位</text><text x="210.0" y="1031" text-anchor="middle" class="card-line">兄弟 stem 都不行 → 再上一幕</text><g filter="url(#shadow)"><rect x="430" y="924" width="340" height="132" rx="14" fill="#ffffff" /></g><path d="M430,964 V938 A14,14 0 0 1 444,924 H756 A14,14 0 0 1 770,938 V964 Z" fill="#f1f5f9" /><rect x="430" y="924" width="340" height="132" rx="14" fill="none" stroke="#64748b" stroke-opacity="0.55" stroke-width="1.3" /><text x="600.0" y="950.0" text-anchor="middle" class="card-title" fill="#0f172a">… 待定</text><text x="600.0" y="989" text-anchor="middle" class="card-line">入场不足：在关口附近加深</text><text x="600.0" y="1010" text-anchor="middle" class="card-line">≥ 6 个入场：34% 回退</text><text x="600.0" y="1031" text-anchor="middle" class="card-line">其余在关口附近</text><g filter="url(#shadow)"><rect x="820" y="924" width="340" height="132" rx="14" fill="#ffffff" /></g><path d="M820,964 V938 A14,14 0 0 1 834,924 H1146 A14,14 0 0 1 1160,938 V964 Z" fill="#ccfbf1" /><rect x="820" y="924" width="340" height="132" rx="14" fill="none" stroke="#0d9488" stroke-opacity="0.55" stroke-width="1.3" /><text x="990.0" y="950.0" text-anchor="middle" class="card-title" fill="#134e4a">↓ 深度不够</text><text x="990.0" y="989" text-anchor="middle" class="card-line">90% 名额在关口附近加深</text><text x="990.0" y="1010" text-anchor="middle" class="card-line">关口重试份额 35% 且优先</text><text x="990.0" y="1031" text-anchor="middle" class="card-line">资源型偏向火堆 · 地图 · 商店</text><path d="M600 224 V262" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-slate)" /><path d="M600 370 V408" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-slate)" /><path d="M600 516 V556" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-slate)" /><path d="M410 604 H292" fill="none" stroke="#16a34a" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)" /><path d="M790 604 H908" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-slate)" /><path d="M600 652 V732" fill="none" stroke="#e11d48" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-rose)" /><path d="M320 790 C230 790 210 840 210 924" fill="none" stroke="#e11d48" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-rose)" /><path d="M600 848 V924" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-slate)" /><path d="M880 790 C970 790 990 840 990 924" fill="none" stroke="#0d9488" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" /><path d="M210 1056 V1098 H1166 V170 H900" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-slate)" stroke-dasharray="6 6" /><path d="M600 1056 V1098" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" /><path d="M990 1056 V1098" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" /><path d="M1144 605 H1166" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" /><path d="M326.0 1160 H360.0" stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="370.0" y="1164.5" class="legend">真实执行与吸收</text><path d="M489.0 1160 H523.0" stroke="#e11d48" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="533.0" y="1164.5" class="legend">诊所判定</text><path d="M613.0 1160 H647.0" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="657.0" y="1164.5" class="legend">验证链路</text><path d="M737.0 1160 H771.0" stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="6 5" /><text x="781.0" y="1164.5" class="legend">下一轮派发</text><text x="600.0" y="1192" text-anchor="middle" class="sub">判定只改变提案顺序和份额；所有真实菜单分支都保留，误判的代价是时间。</text><rect x="316.0" y="592" width="70.0" height="24" rx="12" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.6" /><text x="351" y="608.5" text-anchor="middle" class="pill" fill="#15803d">获胜候选</text><rect x="826.5" y="592" width="45.0" height="24" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-opacity="0.6" /><text x="849" y="608.5" text-anchor="middle" class="pill" fill="#475569">其他</text><rect x="552.5" y="680" width="95.0" height="24" rx="12" fill="#ffffff" stroke="#e11d48" stroke-opacity="0.6" /><text x="600" y="696.5" text-anchor="middle" class="pill" fill="#be123c">首领关口失败</text><rect x="1137.25" y="378" width="57.5" height="24" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-opacity="0.6" /><text x="1166" y="394.5" text-anchor="middle" class="pill" fill="#475569">下一轮</text></svg>