<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1175" width="1200" height="1175" role="img" aria-labelledby="title desc"><title id="title">SpireExact i100 架构概览</title><desc id="desc">SpireBoard 与命令行经资源边界进入 Python 整局搜索。关口诊所判断卡住的首领关口是根不对还是深度不够，决定回上一幕换选项还是在关口附近加深；派发与调速把请求交给常驻原生 worker，CombatSolver 规划战斗，游戏 DLL 执行规则；获胜候选在独立新进程中重放后生成证书。</desc><style>
    text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
