<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 945" width="1200" height="945" role="img" aria-labelledby="title desc"><title id="title">SpireExact i082 Beta 架构概览</title><desc id="desc">SpireBoard 与 CLI 经资源边界进入 Python 整局搜索。常驻原生 worker 使用战斗候选和游戏 DLL执行，合成探针只提供排序信号，获胜候选独立重放后生成证书。</desc><style>
    text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}
    .title{font-size:28px;font-weight:700;fill:#0f172a}
    .sub{font-size:15px;fill:#64748b}
    .layer{font-size:14px;font-weight:700;letter-spacing:1px}
    .node-title{font-size:19px;font-weight:650}
    .node-sub{font-size:15px}
    .edge-label{font-size:13px;font-weight:500;fill:#64748b}
    </style><defs><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" /></marker></defs><rect width="1200" height="945" rx="20" fill="#ffffff" /><text x="48" y="53" class="title">一个种子，贯穿整局的搜索</text><text x="48" y="80" class="sub">SpireExact · full-information search · native replay</text><rect x="935" y="30" width="217" height="38" rx="19" fill="#eff6ff" /><text x="1043.5" y="55" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">i082 Beta · 0.3.1b1</text><rect x="36" y="326" width="1128" height="185" rx="20" fill="#f8fafc" stroke="#e2e8f0" /><text x="58" y="353" class="layer" fill="#475569">02  /  PYTHON · 整局规划</text><rect x="36" y="548" width="1128" height="180" rx="20" fill="#fffbeb" stroke="#e2e8f0" /><text x="58" y="575" class="layer" fill="#475569">03  /  .NET · 原生执行</text><text x="58" y="113" class="layer" fill="#2563eb">01  /  入口与资源</text><text x="58" y="794" class="layer" fill="#15803d">04  /  独立验证</text><rect x="240" y="104" width="300" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="390.0" y="134" text-anchor="middle" class="node-title" fill="#172554">SpireBoard</text><text x="390.0" y="157" text-anchor="middle" class="node-sub" fill="#172554">新建 · 暂停 · 继续 · 退出</text><rect x="660" y="104" width="300" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="810.0" y="134" text-anchor="middle" class="node-title" fill="#172554">命令行</text><text x="810.0" y="157" text-anchor="middle" class="node-sub" fill="#172554">单种子 · 默认 30 分钟</text><rect x="390" y="228" width="420" height="72" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="600.0" y="258" text-anchor="middle" class="node-title" fill="#0f172a">Windows Job · 资源边界</text><text x="600.0" y="281" text-anchor="middle" class="node-sub" fill="#0f172a">8 同型逻辑 CPU · 7 worker · 14 + 2 GiB</text><rect x="75" y="383" width="270" height="94" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" /><text x="210.0" y="413" text-anchor="middle" class="node-title" fill="#0f172a">前缀与结果档案</text><text x="210.0" y="436" text-anchor="middle" class="node-sub" fill="#0f172a">完整字节身份</text><text x="210.0" y="457" text-anchor="middle" class="node-sub" fill="#0f172a">检查点 · 请求缓存</text><rect x="420" y="383" width="360" height="94" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" /><text x="600.0" y="413" text-anchor="middle" class="node-title" fill="#134e4a">宏观搜索主循环</text><text x="600.0" y="436" text-anchor="middle" class="node-sub" fill="#134e4a">聚焦 · 探索 · 关口重试</text><text x="600.0" y="457" text-anchor="middle" class="node-sub" fill="#134e4a">有序吸收 · 评估账本</text><rect x="855" y="383" width="270" height="94" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" /><text x="990.0" y="413" text-anchor="middle" class="node-title" fill="#581c87">模型与合成探针</text><text x="990.0" y="436" text-anchor="middle" class="node-sub" fill="#581c87">F1 / F2 就绪度</text><text x="990.0" y="457" text-anchor="middle" class="node-sub" fill="#581c87">成对选牌 · 只提供排序信号</text><rect x="75" y="600" width="270" height="94" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" /><text x="210.0" y="630" text-anchor="middle" class="node-title" fill="#78350f">CombatSolver</text><text x="210.0" y="653" text-anchor="middle" class="node-sub" fill="#78350f">束搜索战斗候选</text><text x="210.0" y="674" text-anchor="middle" class="node-sub" fill="#78350f">F1 best / F2 first_win</text><rect x="420" y="600" width="360" height="94" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" /><text x="600.0" y="630" text-anchor="middle" class="node-title" fill="#78350f">7 个常驻 worker</text><text x="600.0" y="653" text-anchor="middle" class="node-sub" fill="#78350f">合法菜单 · 整局 rollout</text><text x="600.0" y="674" text-anchor="middle" class="node-sub" fill="#78350f">预测候选 → 原生执行</text><rect x="855" y="600" width="270" height="94" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" /><text x="990.0" y="630" text-anchor="middle" class="node-title" fill="#78350f">游戏 DLL</text><text x="990.0" y="653" text-anchor="middle" class="node-sub" fill="#78350f">用户安装的 v0.111.0</text><text x="990.0" y="674" text-anchor="middle" class="node-sub" fill="#78350f">离线 TestMode</text><rect x="420" y="790" width="360" height="90" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" /><text x="600.0" y="820" text-anchor="middle" class="node-title" fill="#14532d">独立新进程重放</text><text x="600.0" y="843" text-anchor="middle" class="node-sub" fill="#14532d">从开局逐动作执行</text><text x="600.0" y="864" text-anchor="middle" class="node-sub" fill="#14532d">无 advisor / 检查点 / 缓存</text><rect x="855" y="790" width="270" height="90" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" /><text x="990.0" y="820" text-anchor="middle" class="node-title" fill="#0f172a">结果与证书</text><text x="990.0" y="843" text-anchor="middle" class="node-sub" fill="#0f172a">路线 · 身份 · 工作量</text><text x="990.0" y="864" text-anchor="middle" class="node-sub" fill="#0f172a">SpireBoard 实时展示</text><path d="M390 182 L505 228" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" /><path d="M810 182 L695 228" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" /><path d="M600 300 V383" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" /><path d="M345 430 H420" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" marker-start="url(#slate)" /><path d="M855 430 H780" fill="none" stroke="#9333ea" stroke-width="1.6" marker-end="url(#purple)" stroke-linejoin="round" stroke-dasharray="5 5" /><path d="M600 477 V600" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" marker-start="url(#slate)" /><text x="732" y="539" class="edge-label" text-anchor="middle">JSON 请求 / 真实执行结果</text><path d="M345 647 H420" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" marker-start="url(#slate)" /><path d="M780 647 H855" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" marker-start="url(#slate)" /><path d="M728 477 V523 H1150 V756 H600 V790" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#slate)" stroke-linejoin="round" /><text x="1062" y="748" class="edge-label" text-anchor="middle">获胜候选</text><path d="M780 835 H855" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#green)" stroke-linejoin="round" /><text x="600" y="911" text-anchor="middle" class="sub">真实执行进入路线与证据；synthetic 信号只影响算力分配。</text></svg>